name: Restore Attendance Import navigation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/restore-attendance-import-nav.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Add Attendance Import to admin navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/Navbar.tsx')
          s=p.read_text()
          needle="      { href: '/attendance', label: 'Attendance' },\n      { href: '/athletes', label: 'Athletes' },"
          repl="      { href: '/attendance', label: 'Attendance' },\n      { href: '/attendance-import', label: 'Attendance Import' },\n      { href: '/athletes', label: 'Athletes' },"
          count=s.count(needle)
          if count!=2: raise SystemExit(f'Expected 2 admin attendance blocks, found {count}; refusing unsafe edit')
          p.write_text(s.replace(needle,repl))
          PY
      - name: Commit navigation restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/Navbar.tsx
          git diff --cached --quiet && exit 0
          git commit -m 'Add Attendance Import to admin navigation'
          git push origin main
